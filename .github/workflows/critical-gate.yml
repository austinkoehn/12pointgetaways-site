# critical-gate: required check on main. Passes for routine PRs. For a PR that touches a path in
# .github/critical-paths.txt (or carries the `critical` label) it FAILS until the Elon reviewer app
# (elon-reviewer-koehn[bot]) has approved the PR's current head commit with a review whose body has
#   AUSTIN-APPROVED: <link to Austin's chat message>
# That review is posted only by /workspace/scripts/approve-critical.py after Austin's own
# "approve and deploy". Approved by Austin Nov 25, 2026 (Sentinel's 3-point plan).
#
# Security (do not weaken without Austin + Sentinel):
# - pull_request_target runs THIS file and the critical-path list from main, never from the PR.
# - It never checks out or runs PR code. The changed-file list comes from the GitHub API.
# - The `critical` label is only added here for visibility. Removing it changes nothing: the paths
#   decide. Adding it by hand makes a PR critical.
# - No pull_request_review trigger: that event runs the PR's own copy of this file. After posting its
#   review, approve-critical.py re-triggers this check by re-adding the `austin-approved` label (the
#   label itself grants nothing; the gate reads the review).
name: critical-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: critical-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  critical-gate:
    name: critical-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check critical paths and Austin's approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          APPROVER_LOGIN: "elon-reviewer-koehn[bot]"
          APPROVER_ID: "360801162"
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.request, urllib.error
          API = "https://api.github.com"
          TOK, REPO, N = os.environ["GH_TOKEN"], os.environ["REPO"], int(os.environ["PR_NUMBER"])
          MARK = re.compile(r"AUSTIN-APPROVED:\s*(https://\S+|\S{6,})")
          def call(path, method="GET", body=None, raw=False):
              req = urllib.request.Request(API + path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + TOK, "Accept": "application/vnd.github.raw+json" if raw
                           else "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  return data.decode() if raw else (json.loads(data) if data else None)
          def pages(path):
              out, page = [], 1
              while True:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}per_page=100&page={page}")
                  out += chunk
                  if len(chunk) < 100: return out
                  page += 1
          def glob_re(p):
              rx, i = "", 0
              while i < len(p):
                  if p.startswith("**/", i): rx += "(?:.*/)?"; i += 3
                  elif p.startswith("**", i): rx += ".*"; i += 2
                  elif p[i] == "*": rx += "[^/]*"; i += 1
                  elif p[i] == "?": rx += "[^/]"; i += 1
                  else: rx += re.escape(p[i]); i += 1
              return re.compile(rx + r"\Z", re.I)
          pr = call(f"/repos/{REPO}/pulls/{N}")       # fresh read, not the (possibly stale) event payload
          head, base = pr["head"]["sha"], pr["base"]["ref"]
          print(f"PR #{N} head {head} -> {base}")
          reasons = []
          # 1. Critical-path list from the BASE branch (main), never from the PR.
          try:
              text = call(f"/repos/{REPO}/contents/.github/critical-paths.txt?ref={base}", raw=True)
              pats = [l.strip() for l in text.splitlines() if l.strip() and not l.strip().startswith("#")]
          except urllib.error.HTTPError as e:
              pats = None
              reasons.append(f"could not read .github/critical-paths.txt on {base} (HTTP {e.code}); failing closed")
          # 2. Changed files from the API (renames count under both names).
          files = pages(f"/repos/{REPO}/pulls/{N}/files")
          paths = set()
          for f in files:
              paths.add(f["filename"])
              if f.get("previous_filename"): paths.add(f["previous_filename"])
          if pr.get("changed_files", 0) >= 3000 or len(files) >= 3000:
              reasons.append("PR too large to list every file; failing closed")
          if pats:
              rxs = [(p, glob_re(p)) for p in pats]
              for path in sorted(paths):
                  hit = next((p for p, rx in rxs if rx.match(path)), None)
                  if hit: reasons.append(f"{path}  (matches {hit})")
          if any(l["name"].lower() == "critical" for l in pr["labels"]):
              reasons.append("has the `critical` label")
          if not reasons:
              print("Routine PR: no critical paths touched. PASS")
              sys.exit(0)
          print("CRITICAL PR. Reasons:"); [print("  - " + r) for r in reasons]
          if not any(l["name"].lower() == "critical" for l in pr["labels"]):
              try: call(f"/repos/{REPO}/issues/{N}/labels", "POST", {"labels": ["critical"]})
              except urllib.error.HTTPError as e: print(f"::warning::could not add critical label (HTTP {e.code})")
          # 3. Austin's recorded approval: the reviewer app's APPROVED review on this exact head commit.
          reviews = pages(f"/repos/{REPO}/pulls/{N}/reviews")
          ok = None
          for rv in reviews:
              u = rv.get("user") or {}
              if (u.get("login") == os.environ["APPROVER_LOGIN"] and str(u.get("id")) == os.environ["APPROVER_ID"]
                      and rv.get("state") == "APPROVED" and rv.get("commit_id") == head
                      and MARK.search(rv.get("body") or "")):
                  ok = rv
          if ok:
              print(f"Austin's approval recorded: {MARK.search(ok['body']).group(0)}  (review {ok['html_url']}). PASS")
              sys.exit(0)
          print(f"::error::Critical PR. Needs Austin's approval: an APPROVED review by {os.environ['APPROVER_LOGIN']} "
                f"on head {head[:7]} containing 'AUSTIN-APPROVED: <link>'. Elon runs "
                f"/workspace/scripts/approve-critical.py {REPO.split('/')[1]} {N} <link> --head {head[:7]} after Austin says 'approve and deploy'.")
          sys.exit(1)
